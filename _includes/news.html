<div class="well news-panel">
  <div class="news-panel-header">
    <p class="section-kicker">Updates</p>
    <h4>Latest News</h4>
  </div>

{% for article in site.data.news limit:9 %}
  <div class="news-item">
    <time>{{ article.date }}</time>
    {{ article.headline | markdownify}}
  </div>
{% endfor %}

  <a class="news-link" href="{{ "/allnews.html" | relative_url }}">All news</a>
</div>
