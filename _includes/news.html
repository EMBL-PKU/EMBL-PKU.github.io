<div class="news-band-head">
  <div>
    <p class="section-kicker">Updates</p>
    <h2>Latest News</h2>
  </div>
  <a class="news-link" href="{{ "/allnews.html" | relative_url }}">All news &rarr;</a>
</div>

<div class="news-grid">
  {% for article in site.data.news limit:6 %}
  <article class="news-card">
    <time>{{ article.date }}</time>
    <p>{{ article.headline | markdownify }}</p>
  </article>
  {% endfor %}
</div>
