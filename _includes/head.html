<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <meta name="theme-color" content="#94070a">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
  <meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:url" content="{{ page.url | replace:'index.html','' | absolute_url }}">
  <meta property="og:image" content="{{ "/images/hero/landscape-lake.jpg" | absolute_url }}">
  <meta property="og:image:width" content="1946">
  <meta property="og:image:height" content="1094">
  <meta property="og:image:alt" content="{% if page.lang == 'zh' %}PKU-EMBL 实验室 — 野外碱湖研究场景{% else %}PKU-EMBL Lab — alkaline lake field research scene{% endif %}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
  <meta name="twitter:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <meta name="twitter:image" content="{{ "/images/hero/landscape-lake.jpg" | absolute_url }}">
  <meta property="og:locale" content="{% if page.lang == 'zh' %}zh_CN{% else %}en_US{% endif %}">
  <meta property="og:locale:alternate" content="{% if page.lang == 'zh' %}en_US{% else %}zh_CN{% endif %}">
  {% unless page.lang_switch == false %}
  <link rel="alternate" hreflang="{% if page.lang == 'zh' %}en{% else %}zh-CN{% endif %}" href="{% if page.lang == 'zh' %}{{ page.url | remove_first: '/zh' | absolute_url }}{% else %}{{ '/zh' | append: page.url | absolute_url }}{% endif %}">
  {% endunless %}
  <link rel="icon" type="image/png" href="{{ "/images/logo/pku-seal-64.png" | relative_url }}">
  <link rel="apple-touch-icon" href="{{ "/images/logo/pku-seal-512.png" | relative_url }}">
  <link rel="preload" href="{{ "/fonts/josefin-sans-var.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ "/fonts/lato-400.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ "/css/main.css" | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

{% if jekyll.environment == 'production' %}
{% include analytics.html %}
{% endif %}

</head>
